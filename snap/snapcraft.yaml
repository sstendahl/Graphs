ame: graphs
base: core26
adopt-info: graphs
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:
  arm64:

slots:
  graphs:
    interface: dbus
    bus: session
    name: se.sjoerd.Graphs

parts:
  python-deps:
    plugin: nil
    build-packages:
      - python3-venv
      - python3-dev
    override-build: |
      /snap/gnome-core26-sdk/current/usr/bin/python3 -m venv $CRAFT_PART_BUILD/venv
      $CRAFT_PART_BUILD/venv/bin/pip install \
        --target $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages \
        matplotlib==3.11.0 \
        numexpr==2.14.1 \
        numpy==2.4.6 \
        scipy==1.17.1 \
        sympy==1.14.0
      # gio-pyio needs PyGObject, which the GNOME SDK/runtime already provides
      $CRAFT_PART_BUILD/venv/bin/pip install \
        --target $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages \
        --no-deps \
        gio-pyio==0.0.6
      rm -rf $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/bin

  graphs:
    after: [ python-deps ]
    plugin: meson
    source: https://gitlab.gnome.org/World/Graphs.git
    source-tag: 'v2.0.8'
    source-depth: 1
    meson-parameters:
      - --prefix=/snap/graphs/current/usr
      - --buildtype=release
    build-environment:
      - PYTHONPATH: $CRAFT_STAGE/usr/lib/python3/dist-packages:$PYTHONPATH
    build-snaps:
      - blueprint-compiler/latest/edge
    override-build: |
      craftctl default
      sed -e '1c#!/usr/bin/env python3' -i ${CRAFT_PART_INSTALL}/snap/graphs/current/usr/bin/graphs
      mkdir -p $CRAFT_PART_INSTALL/meta/gui
      cp -r $CRAFT_PART_INSTALL/snap/graphs/current/usr/share/icons $CRAFT_PART_INSTALL/meta/gui/
      for i in `find $CRAFT_PART_INSTALL/meta/gui/icons -name "*.svg" -o -name "*.png"`; do
        mv $i "`dirname $i`/snap.$CRAFT_PROJECT_NAME.`basename $i`"
      done
    organize:
      snap/graphs/current/usr: usr
    parse-info: [usr/share/metainfo/se.sjoerd.Graphs.metainfo.xml]

apps:
  graphs:
    command: usr/bin/graphs
    desktop: usr/share/applications/se.sjoerd.Graphs.desktop
    common-id: se.sjoerd.Graphs
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/girepository-1.0:$GI_TYPELIB_PATH
    extensions: [gnome]
